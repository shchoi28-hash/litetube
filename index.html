<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>LiteTube Search A1416</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background-color: #111;
    color: #eee;
    font-family: -apple-system, Helvetica, Arial, sans-serif;
    padding: 10px;
  }
  .bar {
    display: -webkit-flex;
    display: flex;
    margin-bottom: 10px;
  }
  input[type="text"] {
    -webkit-flex: 1;
    flex: 1;
    padding: 10px;
    font-size: 16px;
    border: 1px solid #444;
    border-radius: 6px;
    background: #222;
    color: #fff;
  }
  button {
    margin-left: 6px;
    padding: 10px 14px;
    font-size: 15px;
    font-weight: bold;
    background: #cc0000;
    color: #fff;
    border: none;
    border-radius: 6px;
  }
  button.sub-btn {
    background: #333;
    font-weight: normal;
  }
  #apiBox {
    display: none;
    background: #1e1e1e;
    padding: 10px;
    border-radius: 6px;
    margin-bottom: 10px;
    border: 1px solid #333;
  }
  #apiBox p {
    font-size: 12px;
    color: #aaa;
    margin-bottom: 6px;
  }
  .player-wrap {
    position: relative;
    width: 100%;
    padding-bottom: 56.25%;
    background: #000;
    border-radius: 8px;
    overflow: hidden;
    margin-bottom: 12px;
  }
  iframe {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    border: 0;
  }
  .status {
    font-size: 13px;
    color: #aaa;
    margin-bottom: 8px;
  }
  .result-item {
    display: -webkit-flex;
    display: flex;
    background: #1c1c1c;
    border-radius: 6px;
    padding: 8px;
    margin-bottom: 8px;
    border: 1px solid #2a2a2a;
  }
  .result-thumb {
    width: 120px;
    height: 68px;
    background: #000;
    border-radius: 4px;
    margin-right: 10px;
    -webkit-flex-shrink: 0;
    flex-shrink: 0;
  }
  .result-info {
    -webkit-flex: 1;
    flex: 1;
    overflow: hidden;
  }
  .result-title {
    font-size: 14px;
    font-weight: bold;
    color: #fff;
    line-height: 1.3;
    max-height: 36px;
    overflow: hidden;
    margin-bottom: 4px;
  }
  .result-channel {
    font-size: 12px;
    color: #888;
  }
</style>
</head>
<body>

<div class="bar">
  <input type="text" id="searchInput" placeholder="검색어 또는 유튜브 주소 입력" onkeypress="if(event.keyCode===13) handleSearch()">
  <button onclick="handleSearch()">검색</button>
  <button class="sub-btn" onclick="toggleApiBox()">키 설정</button>
</div>

<div id="apiBox">
  <p>Google Cloud Console에서 발급받은 YouTube Data API v3 키를 입력하세요. (기기에 자동 저장됨)</p>
  <div class="bar" style="margin-bottom:0;">
    <input type="text" id="apiKeyInput" placeholder="AIzaSy...">
    <button onclick="saveApiKey()">저장</button>
  </div>
</div>

<div class="player-wrap">
  <iframe id="ytPlayer" src="" allowfullscreen webkitallowfullscreen></iframe>
</div>

<div class="status" id="statusText">검색어를 입력하면 가벼운 목록으로 불러옵니다.</div>
<div id="resultsList"></div>

<script>
  var API_STORAGE_KEY = 'litetube_yt_apikey';

  window.onload = function() {
    var savedKey = getApiKey();
    if (savedKey) {
      document.getElementById('apiKeyInput').value = savedKey;
    } else {
      document.getElementById('apiBox').style.display = 'block';
    }
  };

  function toggleApiBox() {
    var box = document.getElementById('apiBox');
    box.style.display = (box.style.display === 'none' || box.style.display === '') ? 'block' : 'none';
  }

  function getApiKey() {
    try { return localStorage.getItem(API_STORAGE_KEY) || ''; } catch (e) { return ''; }
  }

  function saveApiKey() {
    var val = document.getElementById('apiKeyInput').value.replace(/^\s+|\s+$/g, '');
    if (!val) {
      alert('API 키를 입력해 주세요.');
      return;
    }
    try {
      localStorage.setItem(API_STORAGE_KEY, val);
      alert('API 키가 저장되었습니다.');
      document.getElementById('apiBox').style.display = 'none';
    } catch (e) {
      alert('저장 실패 (사파리 개인정보 보호 브라우징 모드를 해제해 주세요).');
    }
  }

  function extractId(input) {
    var regExp = /(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?)\/|.*[?&]v=)|youtu\.be\/)([^"&?\/\s]{11})/;
    var match = input.match(regExp);
    return (match && match[1]) ? match[1] : null;
  }

  function playVideo(videoId) {
    var player = document.getElementById('ytPlayer');
    player.src = 'https://www.youtube-nocookie.com/embed/' + videoId + '?autoplay=1&rel=0&playsinline=1';
    window.scrollTo(0, 0);
  }

  function handleSearch() {
    var query = document.getElementById('searchInput').value.replace(/^\s+|\s+$/g, '');
    if (!query) return;

    // 1. 유튜브 링크를 직접 붙여넣은 경우 바로 재생
    var directId = extractId(query);
    if (directId) {
      playVideo(directId);
      return;
    }

    // 2. 키워드 검색 실행
    var apiKey = getApiKey();
    if (!apiKey) {
      alert('먼저 우측 상단 [키 설정]을 눌러 YouTube API 키를 등록해 주세요.');
      document.getElementById('apiBox').style.display = 'block';
      return;
    }

    var statusEl = document.getElementById('statusText');
    var listEl = document.getElementById('resultsList');
    statusEl.innerText = '검색 중...';
    listEl.innerHTML = '';

    var url = 'https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&maxResults=12&q=' +
              encodeURIComponent(query) + '&key=' + encodeURIComponent(apiKey);

    var xhr = new XMLHttpRequest();
    xhr.open('GET', url, true);
    xhr.onreadystatechange = function() {
      if (xhr.readyState === 4) {
        if (xhr.status === 200) {
          try {
            var data = JSON.parse(xhr.responseText);
            renderResults(data.items || []);
          } catch (e) {
            statusEl.innerText = '데이터 파싱 오류가 발생했습니다.';
          }
        } else {
          statusEl.innerText = '검색 실패 (오류 코드: ' + xhr.status + '). API 키와 할당량을 확인해 주세요.';
        }
      }
    };
    xhr.send();
  }

  function renderResults(items) {
    var statusEl = document.getElementById('statusText');
    var listEl = document.getElementById('resultsList');
    listEl.innerHTML = '';

    if (items.length === 0) {
      statusEl.innerText = '검색 결과가 없습니다.';
      return;
    }

    statusEl.innerText = '검색 결과 ' + items.length + '건 (터치 시 즉시 재생)';

    for (var i = 0; i < items.length; i++) {
      (function(item) {
        var vid = item.id.videoId;
        var snippet = item.snippet;
        var thumbUrl = (snippet.thumbnails && snippet.thumbnails.default) ? snippet.thumbnails.default.url : '';

        var div = document.createElement('div');
        div.className = 'result-item';
        div.onclick = function() { playVideo(vid); };

        var img = document.createElement('img');
        img.className = 'result-thumb';
        img.src = thumbUrl;

        var info = document.createElement('div');
        info.className = 'result-info';

        var title = document.createElement('div');
        title.className = 'result-title';
        title.innerHTML = snippet.title; // HTML 엔티티(&quot; 등) 자동 디코딩

        var channel = document.createElement('div');
        channel.className = 'result-channel';
        channel.innerText = snippet.channelTitle;

        info.appendChild(title);
        info.appendChild(channel);
        div.appendChild(img);
        div.appendChild(info);
        listEl.appendChild(div);
      })(items[i]);
    }
  }
</script>
</body>
</html>
